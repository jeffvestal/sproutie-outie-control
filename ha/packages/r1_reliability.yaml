template:
  - binary_sensor:
      - name: R1 watchdog switch top lights
        default_entity_id: binary_sensor.r1_watchdog_switch_top_lights
        unique_id: r1_watchdog_switch_top_lights
        device_class: problem
        state: >-
          {{ states('switch.top_shelf_lights') not in ['on', 'off'] }}
        delay_on:
          seconds: 300
      - name: R1 watchdog power top lights
        default_entity_id: binary_sensor.r1_watchdog_power_top_lights
        unique_id: r1_watchdog_power_top_lights
        device_class: problem
        state: >-
          {{ states('sensor.exhaust_fan_current_consumption') | float(none) is none }}
        delay_on:
          seconds: 600
      - name: R1 watchdog switch bottom lights
        default_entity_id: binary_sensor.r1_watchdog_switch_bottom_lights
        unique_id: r1_watchdog_switch_bottom_lights
        device_class: problem
        state: >-
          {{ states('switch.bottom_shelf_lights') not in ['on', 'off'] }}
        delay_on:
          seconds: 300
      - name: R1 watchdog power bottom lights
        default_entity_id: binary_sensor.r1_watchdog_power_bottom_lights
        unique_id: r1_watchdog_power_bottom_lights
        device_class: problem
        state: >-
          {{ states('sensor.bottom_shelf_fan_current_consumption') | float(none) is none }}
        delay_on:
          seconds: 600
      - name: R1 watchdog switch top fan
        default_entity_id: binary_sensor.r1_watchdog_switch_top_fan
        unique_id: r1_watchdog_switch_top_fan
        device_class: problem
        state: >-
          {{ states('switch.top_shelf_fan') not in ['on', 'off'] }}
        delay_on:
          seconds: 300
      - name: R1 watchdog power top fan
        default_entity_id: binary_sensor.r1_watchdog_power_top_fan
        unique_id: r1_watchdog_power_top_fan
        device_class: problem
        state: >-
          {{ states('sensor.bottom_shelf_lights_current_consumption') | float(none) is none }}
        delay_on:
          seconds: 600
      - name: R1 watchdog switch bottom fan
        default_entity_id: binary_sensor.r1_watchdog_switch_bottom_fan
        unique_id: r1_watchdog_switch_bottom_fan
        device_class: problem
        state: >-
          {{ states('switch.bottom_shelf_fan') not in ['on', 'off'] }}
        delay_on:
          seconds: 300
      - name: R1 watchdog power bottom fan
        default_entity_id: binary_sensor.r1_watchdog_power_bottom_fan
        unique_id: r1_watchdog_power_bottom_fan
        device_class: problem
        state: >-
          {{ states('sensor.top_shelf_fan_current_consumption') | float(none) is none }}
        delay_on:
          seconds: 600
      - name: R1 watchdog switch exhaust
        default_entity_id: binary_sensor.r1_watchdog_switch_exhaust
        unique_id: r1_watchdog_switch_exhaust
        device_class: problem
        state: >-
          {{ states('switch.exhaust_fan') not in ['on', 'off'] }}
        delay_on:
          seconds: 300
      - name: R1 watchdog power exhaust
        default_entity_id: binary_sensor.r1_watchdog_power_exhaust
        unique_id: r1_watchdog_power_exhaust
        device_class: problem
        state: >-
          {{ states('sensor.top_shelf_lights_current_consumption') | float(none) is none }}
        delay_on:
          seconds: 600
      - name: R1 watchdog switch camera flash
        default_entity_id: binary_sensor.r1_watchdog_switch_camera_flash
        unique_id: r1_watchdog_switch_camera_flash
        device_class: problem
        state: >-
          {{ states('switch.camera_flash') not in ['on', 'off'] }}
        delay_on:
          seconds: 300
      - name: R1 watchdog power camera flash
        default_entity_id: binary_sensor.r1_watchdog_power_camera_flash
        unique_id: r1_watchdog_power_camera_flash
        device_class: problem
        state: >-
          {{ states('sensor.camera_flash_current_consumption') | float(none) is none }}
        delay_on:
          seconds: 600
      - name: R1 watchdog climate temperature silent
        default_entity_id: binary_sensor.r1_watchdog_climate_temperature_silent
        unique_id: r1_watchdog_climate_temperature_silent
        device_class: problem
        state: >-
          {{ states('sensor.monitor2_temperature') | float(none) is none }}
        delay_on:
          seconds: 900
      - name: R1 watchdog climate humidity silent
        default_entity_id: binary_sensor.r1_watchdog_climate_humidity_silent
        unique_id: r1_watchdog_climate_humidity_silent
        device_class: problem
        state: >-
          {{ states('sensor.monitor2_humidity') | float(none) is none }}
        delay_on:
          seconds: 900
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    binary_sensor:
      - name: R1 watchdog climate temperature frozen
        default_entity_id: binary_sensor.r1_watchdog_climate_temperature_frozen
        unique_id: r1_watchdog_climate_temperature_frozen
        device_class: problem
        state: >-
          {% set source = expand('sensor.monitor2_temperature') | first | default(none) %}
          {{ source is not none and source.state | float(none) is not none and
             as_timestamp(now()) - as_timestamp(source.last_changed, 0) > 7200 }}
      - name: R1 watchdog climate humidity frozen
        default_entity_id: binary_sensor.r1_watchdog_climate_humidity_frozen
        unique_id: r1_watchdog_climate_humidity_frozen
        device_class: problem
        state: >-
          {% set source = expand('sensor.monitor2_humidity') | first | default(none) %}
          {{ source is not none and source.state | float(none) is not none and
             as_timestamp(now()) - as_timestamp(source.last_changed, 0) > 7200 }}
      - name: R1 watchdog camera top-eyes stale
        default_entity_id: binary_sensor.r1_watchdog_camera_top_eyes_stale
        unique_id: r1_watchdog_camera_top_eyes_stale
        device_class: problem
        state: >-
          {% set modified = states('sensor.r1_top_eyes_snapshot_mtime') | int(0) %}
          {{ modified <= 0 or
             as_timestamp(now()) - modified > 7200 }}
      - name: R1 watchdog camera bottom-eyes stale
        default_entity_id: binary_sensor.r1_watchdog_camera_bottom_eyes_stale
        unique_id: r1_watchdog_camera_bottom_eyes_stale
        device_class: problem
        state: >-
          {% set modified = states('sensor.r1_bottom_eyes_snapshot_mtime') | int(0) %}
          {{ modified <= 0 or
             as_timestamp(now()) - modified > 7200 }}
      - name: R1 watchdog camera sidecar-eyes stale
        default_entity_id: binary_sensor.r1_watchdog_camera_sidecar_eyes_stale
        unique_id: r1_watchdog_camera_sidecar_eyes_stale
        device_class: problem
        state: >-
          {% set modified = states('sensor.r1_sidecar_eyes_snapshot_mtime') | int(0) %}
          {{ modified <= 0 or
             as_timestamp(now()) - modified > 7200 }}

script:
  r1_raise_alert:
    alias: R1 raise keyed reliability alert
    mode: queued
    max: 50
    fields:
      key: {required: true}
      cooldown_entity: {required: true}
      active_entity: {required: true}
      visible_entity: {required: true}
      title: {required: true}
      message: {required: true}
    sequence:
      - condition: template
        value_template: >-
          {{ is_state(visible_entity, 'off') and
             as_timestamp(now()) - as_timestamp(states(cooldown_entity), 0) >= 1800 }}
      - action: persistent_notification.create
        continue_on_error: true
        data:
          notification_id: "{{ key }}"
          title: "{{ title }}"
          message: "{{ message }}"
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ cooldown_entity }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_boolean.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ active_entity }}"
      - action: input_boolean.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ visible_entity }}"
      - action: notify.mobile_app_sergeant_bosco
        continue_on_error: true
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: "{{ key }}"
            group: r1_reliability

  r1_resolve_alert:
    alias: R1 resolve keyed reliability alert
    mode: queued
    max: 50
    fields:
      key: {required: true}
      active_entity: {required: true}
      visible_entity: {required: true}
      title: {required: true}
      message: {required: true}
    sequence:
      - condition: template
        value_template: "{{ is_state(active_entity, 'on') }}"
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ active_entity }}"
      - action: input_boolean.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ visible_entity }}"
      - action: persistent_notification.dismiss
        continue_on_error: true
        data:
          notification_id: "{{ key }}"
      - action: notify.mobile_app_sergeant_bosco
        continue_on_error: true
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: "{{ key }}"
            group: r1_reliability

automation:
  - id: r1_persistent_alert_dismissed
    alias: R1 track dismissed keyed reliability alerts
    mode: queued
    max: 50
    triggers:
      - trigger: persistent_notification
        update_type: removed
    actions:
      - choose:
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_switch_top_lights' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_switch_top_lights
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_power_top_lights' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_power_top_lights
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_switch_bottom_lights' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_switch_bottom_lights
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_power_bottom_lights' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_power_bottom_lights
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_switch_top_fan' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_switch_top_fan
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_power_top_fan' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_power_top_fan
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_switch_bottom_fan' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_switch_bottom_fan
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_power_bottom_fan' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.r1_alert_visible_watchdog_power_bottom_fan
          - conditions: "{{ trigger.notification.notification_id == 'r1_watchdog_switch_exhaust' }}"

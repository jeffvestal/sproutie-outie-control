  - id: r1_reliability_alert_reconcile
    alias: R1 reconcile keyed reliability alerts
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - binary_sensor.r1_watchdog_switch_top_lights
          - binary_sensor.r1_watchdog_power_top_lights
          - binary_sensor.r1_watchdog_switch_bottom_lights
          - binary_sensor.r1_watchdog_power_bottom_lights
          - binary_sensor.r1_watchdog_switch_top_fan
          - binary_sensor.r1_watchdog_power_top_fan
          - binary_sensor.r1_watchdog_switch_bottom_fan
          - binary_sensor.r1_watchdog_power_bottom_fan
          - binary_sensor.r1_watchdog_switch_exhaust
          - binary_sensor.r1_watchdog_power_exhaust
          - binary_sensor.r1_watchdog_switch_camera_flash
          - binary_sensor.r1_watchdog_power_camera_flash
          - binary_sensor.r1_watchdog_climate_temperature_silent
          - binary_sensor.r1_watchdog_climate_temperature_frozen
          - binary_sensor.r1_watchdog_climate_humidity_silent
          - binary_sensor.r1_watchdog_climate_humidity_frozen
          - binary_sensor.r1_watchdog_camera_top_eyes_stale
          - binary_sensor.r1_watchdog_camera_bottom_eyes_stale
          - binary_sensor.r1_watchdog_camera_sidecar_eyes_stale
    actions:
      - repeat:
          for_each:
            - key: r1_watchdog_switch_top_lights
              sensor: binary_sensor.r1_watchdog_switch_top_lights
              cooldown_entity: input_datetime.r1_last_alert_watchdog_switch_top_lights
              active_entity: input_boolean.r1_alert_active_watchdog_switch_top_lights
              visible_entity: input_boolean.r1_alert_visible_watchdog_switch_top_lights
              title: "R1 switch watchdog · top lights"
              message: >-
                top lights expects switch.top_shelf_lights, but the entity is missing, unknown, or unavailable for 5 minutes. This is an integration/entity-ID failure.
            - key: r1_watchdog_power_top_lights
              sensor: binary_sensor.r1_watchdog_power_top_lights
              cooldown_entity: input_datetime.r1_last_alert_watchdog_power_top_lights
              active_entity: input_boolean.r1_alert_active_watchdog_power_top_lights
              visible_entity: input_boolean.r1_alert_visible_watchdog_power_top_lights
              title: "R1 power watchdog · top lights"
              message: >-
                top lights power telemetry sensor.exhaust_fan_current_consumption has reported N/A, unavailable, or another non-numeric value for 10 minutes.
            - key: r1_watchdog_switch_bottom_lights
              sensor: binary_sensor.r1_watchdog_switch_bottom_lights
              cooldown_entity: input_datetime.r1_last_alert_watchdog_switch_bottom_lights
              active_entity: input_boolean.r1_alert_active_watchdog_switch_bottom_lights
              visible_entity: input_boolean.r1_alert_visible_watchdog_switch_bottom_lights
              title: "R1 switch watchdog · bottom lights"
              message: >-
                bottom lights expects switch.bottom_shelf_lights, but the entity is missing, unknown, or unavailable for 5 minutes. This is an integration/entity-ID failure.
            - key: r1_watchdog_power_bottom_lights
              sensor: binary_sensor.r1_watchdog_power_bottom_lights
              cooldown_entity: input_datetime.r1_last_alert_watchdog_power_bottom_lights
              active_entity: input_boolean.r1_alert_active_watchdog_power_bottom_lights
              visible_entity: input_boolean.r1_alert_visible_watchdog_power_bottom_lights
              title: "R1 power watchdog · bottom lights"
              message: >-
                bottom lights power telemetry sensor.bottom_shelf_fan_current_consumption has reported N/A, unavailable, or another non-numeric value for 10 minutes.
            - key: r1_watchdog_switch_top_fan
              sensor: binary_sensor.r1_watchdog_switch_top_fan
              cooldown_entity: input_datetime.r1_last_alert_watchdog_switch_top_fan
              active_entity: input_boolean.r1_alert_active_watchdog_switch_top_fan
              visible_entity: input_boolean.r1_alert_visible_watchdog_switch_top_fan
              title: "R1 switch watchdog · top fan"
              message: >-
                top fan expects switch.top_shelf_fan, but the entity is missing, unknown, or unavailable for 5 minutes. This is an integration/entity-ID failure.
            - key: r1_watchdog_power_top_fan
              sensor: binary_sensor.r1_watchdog_power_top_fan
              cooldown_entity: input_datetime.r1_last_alert_watchdog_power_top_fan
              active_entity: input_boolean.r1_alert_active_watchdog_power_top_fan
              visible_entity: input_boolean.r1_alert_visible_watchdog_power_top_fan
              title: "R1 power watchdog · top fan"
              message: >-
                top fan power telemetry sensor.bottom_shelf_lights_current_consumption has reported N/A, unavailable, or another non-numeric value for 10 minutes.
            - key: r1_watchdog_switch_bottom_fan
              sensor: binary_sensor.r1_watchdog_switch_bottom_fan
              cooldown_entity: input_datetime.r1_last_alert_watchdog_switch_bottom_fan
              active_entity: input_boolean.r1_alert_active_watchdog_switch_bottom_fan
              visible_entity: input_boolean.r1_alert_visible_watchdog_switch_bottom_fan
              title: "R1 switch watchdog · bottom fan"
              message: >-
                bottom fan expects switch.bottom_shelf_fan, but the entity is missing, unknown, or unavailable for 5 minutes. This is an integration/entity-ID failure.
            - key: r1_watchdog_power_bottom_fan
              sensor: binary_sensor.r1_watchdog_power_bottom_fan
              cooldown_entity: input_datetime.r1_last_alert_watchdog_power_bottom_fan
              active_entity: input_boolean.r1_alert_active_watchdog_power_bottom_fan
              visible_entity: input_boolean.r1_alert_visible_watchdog_power_bottom_fan
              title: "R1 power watchdog · bottom fan"
              message: >-
                bottom fan power telemetry sensor.top_shelf_fan_current_consumption has reported N/A, unavailable, or another non-numeric value for 10 minutes.
            - key: r1_watchdog_switch_exhaust
              sensor: binary_sensor.r1_watchdog_switch_exhaust
              cooldown_entity: input_datetime.r1_last_alert_watchdog_switch_exhaust
              active_entity: input_boolean.r1_alert_active_watchdog_switch_exhaust
              visible_entity: input_boolean.r1_alert_visible_watchdog_switch_exhaust
              title: "R1 switch watchdog · exhaust"
              message: >-
                exhaust expects switch.exhaust_fan, but the entity is missing, unknown, or unavailable for 5 minutes. This is an integration/entity-ID failure.
            - key: r1_watchdog_power_exhaust
              sensor: binary_sensor.r1_watchdog_power_exhaust
              cooldown_entity: input_datetime.r1_last_alert_watchdog_power_exhaust
              active_entity: input_boolean.r1_alert_active_watchdog_power_exhaust
              visible_entity: input_boolean.r1_alert_visible_watchdog_power_exhaust
              title: "R1 power watchdog · exhaust"
              message: >-
                exhaust power telemetry sensor.top_shelf_lights_current_consumption has reported N/A, unavailable, or another non-numeric value for 10 minutes.
            - key: r1_watchdog_switch_camera_flash
              sensor: binary_sensor.r1_watchdog_switch_camera_flash
              cooldown_entity: input_datetime.r1_last_alert_watchdog_switch_camera_flash
              active_entity: input_boolean.r1_alert_active_watchdog_switch_camera_flash
              visible_entity: input_boolean.r1_alert_visible_watchdog_switch_camera_flash
              title: "R1 switch watchdog · camera flash"
              message: >-
                camera flash expects switch.camera_flash, but the entity is missing, unknown, or unavailable for 5 minutes. This is an integration/entity-ID failure.
            - key: r1_watchdog_power_camera_flash
              sensor: binary_sensor.r1_watchdog_power_camera_flash
              cooldown_entity: input_datetime.r1_last_alert_watchdog_power_camera_flash
              active_entity: input_boolean.r1_alert_active_watchdog_power_camera_flash
              visible_entity: input_boolean.r1_alert_visible_watchdog_power_camera_flash
              title: "R1 power watchdog · camera flash"
              message: >-
                camera flash power telemetry sensor.camera_flash_current_consumption has reported N/A, unavailable, or another non-numeric value for 10 minutes.
            - key: r1_watchdog_climate_temperature_silent
              sensor: binary_sensor.r1_watchdog_climate_temperature_silent
              cooldown_entity: input_datetime.r1_last_alert_watchdog_climate_temperature_silent
              active_entity: input_boolean.r1_alert_active_watchdog_climate_temperature_silent
              visible_entity: input_boolean.r1_alert_visible_watchdog_climate_temperature_silent
              title: "R1 Govee watchdog · temperature silent"
              message: >-
                Govee tent temperature sensor.monitor2_temperature has been missing or non-numeric for 15 minutes.
            - key: r1_watchdog_climate_temperature_frozen
              sensor: binary_sensor.r1_watchdog_climate_temperature_frozen
              cooldown_entity: input_datetime.r1_last_alert_watchdog_climate_temperature_frozen
              active_entity: input_boolean.r1_alert_active_watchdog_climate_temperature_frozen
              visible_entity: input_boolean.r1_alert_visible_watchdog_climate_temperature_frozen
              title: "R1 Govee watchdog · temperature frozen"
              message: >-
                Govee tent temperature sensor.monitor2_temperature has reported exactly the same value for more than 2 hours.
            - key: r1_watchdog_climate_humidity_silent
              sensor: binary_sensor.r1_watchdog_climate_humidity_silent
              cooldown_entity: input_datetime.r1_last_alert_watchdog_climate_humidity_silent
              active_entity: input_boolean.r1_alert_active_watchdog_climate_humidity_silent
              visible_entity: input_boolean.r1_alert_visible_watchdog_climate_humidity_silent
              title: "R1 Govee watchdog · humidity silent"
              message: >-
                Govee tent humidity sensor.monitor2_humidity has been missing or non-numeric for 15 minutes.
            - key: r1_watchdog_climate_humidity_frozen
              sensor: binary_sensor.r1_watchdog_climate_humidity_frozen
              cooldown_entity: input_datetime.r1_last_alert_watchdog_climate_humidity_frozen
              active_entity: input_boolean.r1_alert_active_watchdog_climate_humidity_frozen
              visible_entity: input_boolean.r1_alert_visible_watchdog_climate_humidity_frozen
              title: "R1 Govee watchdog · humidity frozen"
              message: >-
                Govee tent humidity sensor.monitor2_humidity has reported exactly the same value for more than 2 hours.
            - key: r1_watchdog_camera_top_eyes_stale
              sensor: binary_sensor.r1_watchdog_camera_top_eyes_stale
              cooldown_entity: input_datetime.r1_last_alert_watchdog_camera_top_eyes_stale
              active_entity: input_boolean.r1_alert_active_watchdog_camera_top_eyes_stale
              visible_entity: input_boolean.r1_alert_visible_watchdog_camera_top_eyes_stale
              title: "R1 camera watchdog · top-eyes"
              message: >-
                top-eyes (camera.top_eyes_snapshot) has no `_latest.jpg` modification within 120 minutes (2× the configured photo interval).
            - key: r1_watchdog_camera_bottom_eyes_stale
              sensor: binary_sensor.r1_watchdog_camera_bottom_eyes_stale
              cooldown_entity: input_datetime.r1_last_alert_watchdog_camera_bottom_eyes_stale
              active_entity: input_boolean.r1_alert_active_watchdog_camera_bottom_eyes_stale
              visible_entity: input_boolean.r1_alert_visible_watchdog_camera_bottom_eyes_stale
              title: "R1 camera watchdog · bottom-eyes"
              message: >-
                bottom-eyes (camera.bottom_eyes_snapshot) has no `_latest.jpg` modification within 120 minutes (2× the configured photo interval).
            - key: r1_watchdog_camera_sidecar_eyes_stale
              sensor: binary_sensor.r1_watchdog_camera_sidecar_eyes_stale
              cooldown_entity: input_datetime.r1_last_alert_watchdog_camera_sidecar_eyes_stale
              active_entity: input_boolean.r1_alert_active_watchdog_camera_sidecar_eyes_stale
              visible_entity: input_boolean.r1_alert_visible_watchdog_camera_sidecar_eyes_stale
              title: "R1 camera watchdog · sidecar-eyes"
              message: >-
                sidecar-eyes (camera.sidecar_eyes_snapshot) has no `_latest.jpg` modification within 120 minutes (2× the configured photo interval).
          sequence:
            - choose:
                - conditions: "{{ is_state(repeat.item.sensor, 'on') }}"
                  sequence:
                    - action: script.r1_raise_alert
                      data:
                        key: "{{ repeat.item.key }}"
                        cooldown_entity: "{{ repeat.item.cooldown_entity }}"
                        active_entity: "{{ repeat.item.active_entity }}"
                        visible_entity: "{{ repeat.item.visible_entity }}"
                        title: "{{ repeat.item.title }}"
                        message: "{{ repeat.item.message }}"
                - conditions: "{{ is_state(repeat.item.sensor, 'off') }}"
                  sequence:
                    - action: script.r1_resolve_alert
                      data:
                        key: "{{ repeat.item.key }}"
                        active_entity: "{{ repeat.item.active_entity }}"
                        visible_entity: "{{ repeat.item.visible_entity }}"
                        title: "R1 watchdog resolved"
                        message: "{{ repeat.item.title }} has cleared."

  - id: r1_daily_reliability_heartbeat
    alias: R1 daily reliability heartbeat
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    actions:
      - action: notify.mobile_app_sergeant_bosco
        continue_on_error: true
        data:
          title: R1 daily tent heartbeat
          message: >-
            {% set verified_entities = ['input_boolean.r1_top_lights_verified', 'input_boolean.r1_bottom_lights_verified', 'input_boolean.r1_top_fan_verified', 'input_boolean.r1_bottom_fan_verified', 'input_boolean.r1_exhaust_verified', 'input_boolean.r1_camera_flash_verified'] %}
            {% set fault_entities = ['binary_sensor.r1_watchdog_switch_top_lights', 'binary_sensor.r1_watchdog_power_top_lights', 'binary_sensor.r1_watchdog_switch_bottom_lights', 'binary_sensor.r1_watchdog_power_bottom_lights', 'binary_sensor.r1_watchdog_switch_top_fan', 'binary_sensor.r1_watchdog_power_top_fan', 'binary_sensor.r1_watchdog_switch_bottom_fan', 'binary_sensor.r1_watchdog_power_bottom_fan', 'binary_sensor.r1_watchdog_switch_exhaust', 'binary_sensor.r1_watchdog_power_exhaust', 'binary_sensor.r1_watchdog_switch_camera_flash', 'binary_sensor.r1_watchdog_power_camera_flash', 'binary_sensor.r1_watchdog_climate_temperature_silent', 'binary_sensor.r1_watchdog_climate_temperature_frozen', 'binary_sensor.r1_watchdog_climate_humidity_silent', 'binary_sensor.r1_watchdog_climate_humidity_frozen', 'binary_sensor.r1_watchdog_camera_top_eyes_stale', 'binary_sensor.r1_watchdog_camera_bottom_eyes_stale', 'binary_sensor.r1_watchdog_camera_sidecar_eyes_stale'] %}
            {% set fault_objects = expand(fault_entities) | list %}
            {% set verified = expand(verified_entities) | selectattr('state', 'eq', 'on') | list | count %}
            {% set faults = fault_objects | selectattr('state', 'eq', 'on') | list | count %}
            {% set healthy = fault_objects | selectattr('state', 'eq', 'off') | list | count %}
            {% set unknown = 19 - healthy - faults %}
            {% if verified == 6 and healthy == 19 %}
              Tent nominal, 6/6 devices verified.
            {% else %}
              Tent attention required: {{ verified }}/6 devices verified; {{ faults }} watchdog fault(s) active; {{ unknown }} watchdog signal(s) unknown, unavailable, or missing.
            {% endif %}
          data:
            tag: r1_daily_heartbeat
            group: r1_reliability

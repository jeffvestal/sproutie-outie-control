                camera flash did not pass state-and-power verification after two commands.
              {% endif %}

r1_toggle_camera_flash:
  alias: R1 toggle camera flash through verification
  mode: restart
  sequence:
    - action: script.r1_set_camera_flash
      data:
        desired: "{{ 'off' if is_state('switch.camera_flash', 'on') else 'on' }}"

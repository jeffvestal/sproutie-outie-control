# Generated by scripts/render_r1_role_scripts.py from config/site.yaml. Do not edit.

r1_set_top_lights:
  alias: R1 set top lights
  mode: restart
  fields:
    desired:
      required: true
      selector:
        select:
          options: ["on", "off"]
  sequence:
    - condition: template
      value_template: >-
        {{ desired == 'off' or 'top_lights' == 'exhaust' or is_state('input_boolean.r1_thermal_latch', 'off') }}
    - action: switch.turn_{{ desired }}
      target:
        entity_id: switch.top_shelf_lights
    - wait_template: >-
        {% set watts = states('sensor.exhaust_fan_current_consumption') | float(none) %}
        {% if desired == 'on' %}
          {{ is_state('switch.top_shelf_lights', 'on') and watts is not none and 28 <= watts <= 32 }}
        {% else %}
          {{ is_state('switch.top_shelf_lights', 'off') and watts is not none and watts <= 0.5 }}
        {% endif %}
      timeout: "00:02:00"
      continue_on_timeout: true
    - if:
        - condition: template
          value_template: "{{ not wait.completed }}"
      then:
        - action: persistent_notification.create
          data:
            title: R1 command verification failed
            message: top_lights did not reach the requested state and power range.

